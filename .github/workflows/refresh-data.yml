# Bakes data/live.json + data/hydro.json once a day so visitors read small
# same-origin files instead of each browser hitting USGS/CDSS. The commit
# lands on main, which GitHub Pages redeploys automatically.
name: Refresh live data

on:
  schedule:
    - cron: '15 12 * * *'   # 12:15 UTC ≈ 6:15 am MDT, after overnight readings post
  workflow_dispatch: {}      # manual run from the Actions tab

permissions:
  contents: write

concurrency: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch USGS + CDSS readings
        run: python3 scripts/fetch_live.py

      - name: Commit if changed
        run: |
          git add data/live.json data/hydro.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: daily live refresh $(date -u +%F)"
          git push
