# Bakes data/live.json + data/hydro.json once a day so visitors read small
# same-origin files instead of each browser hitting USGS/CDSS, then deploys
# the site to Cloudflare Pages (project colorado-water). GitHub Pages no
# longer serves water.myjimmycloud.com, so a commit alone publishes nothing:
# the deploy step below is what puts the new readings live.
name: Refresh live data

on:
  schedule:
    - cron: '15 12 * * *'   # 12:15 UTC ≈ 6:15 am MDT, after overnight readings post
  workflow_dispatch: {}      # manual run from the Actions tab; also deploys

permissions:
  contents: write

concurrency: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch USGS + CDSS readings
        run: python3 scripts/fetch_live.py

      - name: Commit if changed
        run: |
          git add data/live.json data/hydro.json data/raw
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: daily live refresh $(date -u +%F)"
          git push

      # Only what the site serves: the pages, css, js, img, data and icons.
      # Repo notes, scripts/, package files and tests stay out.
      - name: Stage the site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -r *.html css js img data favicon.ico apple-touch-icon.png "$RUNNER_TEMP/site/"

      # wranglerVersion is pinned: the action's default 3.x ignores a .jsonc
      # config and can deploy nothing behind a green check.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.42.0"
          command: pages deploy ${{ runner.temp }}/site --project-name colorado-water --branch main --commit-dirty=true
